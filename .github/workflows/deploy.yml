name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || 22 }}
          script: |
            set -e
            COMPOSE_FILE=/root/WyckoffTradingAgent/deploy/docker-compose.yml
            cd /root/WyckoffTradingAgent

            echo "[1/3] git pull..."
            git pull origin main

            echo "[2/3] docker compose build..."
            docker compose -f $COMPOSE_FILE build --no-cache

            echo "[3/3] docker compose up -d..."
            docker compose -f $COMPOSE_FILE up -d

            sleep 5
            curl -sf http://localhost/api/health && echo "✅ 部署成功" || echo "⚠️ 健康检查未通过"
