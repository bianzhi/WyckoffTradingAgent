name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package & transfer code to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || 22 }}
          source: "web,deploy,cli,agents,core,integrations,tools,utils,scripts,data,docs,mcp_server.py,AGENTS.md,pyproject.toml,requirements.txt"
          target: /tmp/wyckoff-deploy/
          strip_components: 0
          rm: true

      - name: Rebuild & restart on ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || 22 }}
          command_timeout: "60m"
          script: |
            set -e

            # 先停掉旧容器（必须在删目录前，否则 compose 文件丢失无法 down）
            COMPOSE_FILE_OLD=/root/WyckoffTradingAgent/deploy/docker-compose.yml
            if [ -f "$COMPOSE_FILE_OLD" ]; then
              docker compose -f "$COMPOSE_FILE_OLD" down --remove-orphans 2>/dev/null || true
            fi
            # 兜底：强制删除可能残留的同名容器
            docker rm -f wyckoff-api wyckoff-agent wyckoff-web 2>/dev/null || true

            # 备份 .env.production（不在 git 里，清理目录会删掉）
            cp /root/WyckoffTradingAgent/deploy/.env.production /tmp/.env.production.bak 2>/dev/null || true

            # 同步代码：先删旧目录，再从 SCP 传输目录复制
            rm -rf /root/WyckoffTradingAgent/
            mkdir -p /root/WyckoffTradingAgent/

            # Node.js 部分
            cp -a /tmp/wyckoff-deploy/web/ /root/WyckoffTradingAgent/web/
            cp -a /tmp/wyckoff-deploy/deploy/ /root/WyckoffTradingAgent/deploy/

            # Python 部分
            for dir in cli agents core integrations tools utils scripts data; do
              cp -a /tmp/wyckoff-deploy/$dir/ /root/WyckoffTradingAgent/$dir/
            done
            for f in mcp_server.py AGENTS.md pyproject.toml requirements.txt; do
              cp -a /tmp/wyckoff-deploy/$f /root/WyckoffTradingAgent/$f
            done

            # 恢复 .env.production
            cp /tmp/.env.production.bak /root/WyckoffTradingAgent/deploy/.env.production 2>/dev/null || true

            # 导出 VITE_ 构建参数（docker compose 需要 shell 环境变量）
            export $(grep -v '^#' /root/WyckoffTradingAgent/deploy/.env.production | xargs) 2>/dev/null || true

            COMPOSE_FILE=/root/WyckoffTradingAgent/deploy/docker-compose.yml
            cd /root/WyckoffTradingAgent

            echo "[0/3] cleaning up (only if disk low)..."
            DISK_USAGE=$(df /var/lib/docker 2>/dev/null | awk 'NR==2 {print $5}' | tr -d '%' || echo "0")
            if [ "${DISK_USAGE:-0}" -gt 80 ]; then
              echo "Disk usage ${DISK_USAGE}%, pruning build cache..."
              docker builder prune -f --keep-storage=2GB 2>/dev/null || true
            else
              echo "Disk usage ${DISK_USAGE:-?}%, skip aggressive prune"
            fi
            # Only remove dangling images, never remove -a (all unused)
            docker image prune -f 2>/dev/null || true
            df -h /var/lib/docker 2>/dev/null || df -h /

            echo "[1/3] docker compose build..."
            docker compose -f $COMPOSE_FILE build --progress=plain

            echo "[2/3] docker compose up -d..."
            docker compose -f $COMPOSE_FILE up -d

            # 等待 API 健康检查通过（interval=30s，最多等 60s）
            for i in $(seq 1 12); do
              if curl -sf http://localhost/api/health > /dev/null 2>&1; then
                echo "✅ 部署成功" && break
              fi
              sleep 5
            done
