worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        off;  # Docker overlay 文件系统必须关闭，否则静态资源随机返回 503
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ── Upstream: Wyckoff API (Node.js Hono) ──
    upstream api {
        server api:8787;
    }

    server {
        listen 80;
        server_name _;

        # Security: don't reveal server version
        server_tokens off;

        # ── API routes → Node.js ──
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE support for LLM streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # ── Market data static files ──
        location /market-data/ {
            alias /usr/share/nginx/html/market-data/;
            expires 5m;
            add_header Cache-Control "public, max-age=300";
        }

        # ── Health check ──
        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # ── SPA: /moyan/ prefix (canonical) ──
        # All React routes live under /moyan/. Static assets get long cache;
        # index.html must never be cached so updates take effect immediately.
        location /moyan/ {
            alias /usr/share/nginx/html/;

            # Static assets (hashed filenames) — cache aggressively
            location ~* /moyan/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
                alias /usr/share/nginx/html/;
                rewrite ^/moyan/(.*)$ /$1 break;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            # Everything else (including index.html) — no cache
            try_files $uri $uri/ /moyan/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # ── SPA catch-all: bare paths without /moyan/ prefix ──
        # React Router can produce links like /analysis?code=xxx when
        # referer/JS lacks the basename.  Instead of returning 404,
        # redirect to the canonical /moyan/ path so the SPA handles it.
        # Use absolute redirect to preserve non-standard ports (e.g. :8901).
        location / {
            # Redirect /analysis?code=xxx → /moyan/analysis?code=xxx
            if ($request_uri ~ "^/([a-zA-Z0-9_-]+(\?.*)?)$") {
                return 301 $scheme://$http_host/moyan/$1;
            }
            # Fallback: anything else → SPA root
            return 301 $scheme://$http_host/moyan/;
        }
    }
}
