worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        off;  # Docker overlay 文件系统必须关闭，否则静态资源随机返回 503
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ── Upstream: Wyckoff API (Node.js Hono) ──
    upstream api {
        server api:8787;
    }

    server {
        listen 80;
        server_name _;

        # Security: don't reveal server version
        server_tokens off;

        # ── API routes → Node.js ──
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE support for LLM streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # ── Market data static files ──
        location /market-data/ {
            alias /usr/share/nginx/html/market-data/;
            expires 5m;
            add_header Cache-Control "public, max-age=300";
        }

        # ── SPA fallback: all other routes → index.html ──
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ── Health check ──
        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
